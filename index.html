<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushroom Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0ecf1; --surface:#fff; --ink:#2b1d2f; --muted:#6c5d70; --line:#ddd3df; --plum:#5b2f5f; --on-plum:#fff;
    --amber:#e9a23b; --cap:#8a4f3a; --stem:#efe3d2; --soft:#f6f1f7; --danger:#b3261e;
    --shadow:0 2px 4px rgba(43,29,47,.06), 0 16px 40px rgba(43,29,47,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161018; --surface:#221826; --ink:#f3ebf5; --muted:#b3a3b8; --line:#382a3d; --plum:#d9a6dd; --on-plum:#24112a;
      --amber:#f0b24b; --cap:#a8644c; --stem:#e6d8c6; --soft:#2b2030; --danger:#ff8a80; --shadow:0 2px 4px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 17px/1.55 "Nunito Sans", system-ui, sans-serif; overflow-x: hidden; }
  h1, h2 { font-family: "Gabarito", system-ui, sans-serif; margin: 0; letter-spacing: -.015em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

  nav { display: flex; align-items: center; gap: 10px; padding: 24px 0; font: 800 1.15rem "Gabarito", sans-serif; animation: down .6s both; }
  nav svg { width: 34px; height: 34px; }
  @keyframes down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  .hero { display: grid; gap: 36px; align-items: center; padding: 12px 0 72px; }
  @media (min-width: 900px) { .hero { grid-template-columns: 1.05fr 1fr; gap: 56px; padding-top: 28px; } }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.04; font-weight: 800; animation: up .7s .1s both; }
  h1 em { font-style: normal; color: var(--plum); }
  .lead { color: var(--muted); font-size: 1.1rem; margin: 14px 0 26px; max-width: 46ch; animation: up .7s .2s both; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); max-width: 480px; animation: up .7s .3s both; }
  form { display: grid; gap: 20px; }
  label, .lbl { font-weight: 700; font-size: .98rem; display: block; margin-bottom: 7px; transition: color .2s; }
  .field:focus-within > label { color: var(--plum); }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--soft); border: 2px solid transparent; border-radius: 13px; padding: 14px 16px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder { color: #9a8b9f; }
  input:focus { outline: none; border-color: var(--plum); background: var(--surface); box-shadow: 0 0 0 5px color-mix(in srgb, var(--plum) 16%, transparent); }

  .stepper { display: flex; align-items: center; background: var(--soft); border-radius: 13px; padding: 5px; border: 2px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stepper:focus-within { border-color: var(--plum); box-shadow: 0 0 0 5px color-mix(in srgb, var(--plum) 16%, transparent); }
  .stepper button { width: 46px; height: 46px; flex: none; border: 0; border-radius: 10px; background: var(--surface); color: var(--plum); font: 800 1.5rem "Gabarito", sans-serif; cursor: pointer; box-shadow: 0 1px 3px rgba(43,29,47,.15); transition: transform .12s, background .2s, color .2s; }
  .stepper button:hover { background: var(--plum); color: var(--on-plum); }
  .stepper button:active { transform: scale(.88); }
  .stepper .val { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .stepper input { width: 5.2ch; text-align: center; font: 800 1.9rem "Gabarito", sans-serif; background: transparent; border: 0; padding: 4px 0; box-shadow: none; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { box-shadow: none; background: transparent; }
  .stepper .val span { color: var(--muted); font-weight: 700; }
  .bump { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.25); color: var(--plum); } }

  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font: 700 .95rem "Nunito Sans", sans-serif; padding: 7px 14px; border: 2px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--plum); transform: translateY(-2px); }
  .chip.on { background: var(--plum); color: var(--on-plum); border-color: var(--plum); }

  .go {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    font: 800 1.15rem "Gabarito", sans-serif; background: var(--plum); color: var(--on-plum); border: 0; border-radius: 14px; padding: 16px; cursor: pointer;
    box-shadow: 0 10px 24px color-mix(in srgb, var(--plum) 35%, transparent); transition: transform .15s, filter .2s;
  }
  .go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s; }
  .go:hover::after { transform: translateX(120%); }
  .go:hover { transform: translateY(-2px); }
  .go:active { transform: scale(.98); }
  .go:disabled { cursor: wait; filter: opacity(.8); transform: none; }
  .go:focus-visible, .stepper button:focus-visible, .chip:focus-visible, .again:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .spin { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; display: none; }
  .busy .spin { display: block; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .err { margin: 0; min-height: 1.4em; color: var(--danger); font-weight: 700; font-size: .95rem; }
  .err.show { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* SUCCESS */
  .ok { display: none; text-align: center; padding: 10px 0; }
  .done form { display: none; }
  .done .ok { display: block; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(16px); } to { opacity: 1; transform: none; } }
  .ok svg { width: 84px; height: 84px; }
  .ok circle { fill: none; stroke: var(--plum); stroke-width: 5; stroke-dasharray: 170; stroke-dashoffset: 170; animation: draw .7s .1s forwards; }
  .ok path { fill: none; stroke: var(--plum); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .5s .6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ok h2 { font-size: 1.6rem; margin: 10px 0 6px; }
  .ok p { margin: 0 0 20px; color: var(--muted); }
  .ok strong { color: var(--ink); }
  .again { font: 700 1rem "Nunito Sans", sans-serif; background: transparent; color: var(--plum); border: 2px solid var(--plum); border-radius: 12px; padding: 11px 20px; cursor: pointer; transition: background .2s, color .2s; }
  .again:hover { background: var(--plum); color: var(--on-plum); }

  /* ART - si Moki */
  .stage { display: grid; gap: 14px; justify-items: center; }
  .art { position: relative; aspect-ratio: 1 / .92; max-width: 520px; width: 100%; }
  .art::before { content: ""; position: absolute; inset: 10% 4% 2%; border-radius: 50%; background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--amber) 30%, transparent), transparent 68%); }
  .art svg { position: relative; width: 100%; height: 100%; overflow: visible; }
  #moki { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .enter, .hop, .squish, .fr-in, .bob { transform-box: fill-box; transform-origin: 50% 100%; }
  .shadow, .eye { transform-box: fill-box; transform-origin: 50% 50%; }
  .enter { animation: mIn .9s .3s cubic-bezier(.2,1.4,.4,1) both; }
  .hop { animation: hop 6s 1.6s infinite; }
  .squish { animation: breathe 3s ease-in-out infinite alternate; }
  .shadow { animation: shad 6s 1.6s infinite; }
  .eye { animation: blink 4.2s 2s infinite; }
  .look { transition: transform .12s ease-out; }
  .armR { transform-origin: 266px 252px; animation: wave 6s 1.6s infinite; }
  .armL { transform-origin: 154px 254px; animation: sway 3s ease-in-out infinite alternate; }
  .sprout { transform-origin: 210px 62px; animation: sprout 2.8s ease-in-out infinite alternate; }
  .fr-in { animation: mIn .8s cubic-bezier(.2,1.4,.4,1) both; } .i1 { animation-delay: .9s; } .i2 { animation-delay: 1.1s; }
  .bob { animation: bob 2.4s ease-in-out infinite alternate; } .b2 { animation-duration: 2.9s; animation-delay: -1.2s; }
  .eyes-happy, .mouth-open { display: none; }
  #moki.joy .eyes-open, #moki.joy .mouth { display: none; }
  #moki.joy .eyes-happy, #moki.joy .mouth-open { display: block; }
  #moki.happy .hop { animation: cheer .6s ease-in-out 4; }
  #moki.happy .shadow { animation: shadCheer .6s ease-in-out 4; }
  #moki.happy .armR { animation: up .3s ease-in-out infinite alternate; }
  #moki.happy .armL { animation: upL .3s ease-in-out infinite alternate; }
  #moki.poke .squish { animation: boing .65s; }
  @keyframes mIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes breathe { from { transform: scale(1.012, .988); } to { transform: scale(.992, 1.01); } }
  @keyframes hop { 0%, 52%, 90%, 100% { transform: none; } 57% { transform: scale(1.07, .9); } 66% { transform: translateY(-48px) scale(.96, 1.06); } 76% { transform: scale(1.08, .9); } 83% { transform: scale(.98, 1.03); } }
  @keyframes shad { 0%, 52%, 90%, 100% { transform: none; } 66% { transform: scale(.72); } 76% { transform: scale(1.06); } }
  @keyframes wave { 0%, 30%, 100% { transform: rotate(0); } 4%, 12%, 20% { transform: rotate(-20deg); } 8%, 16%, 24% { transform: rotate(14deg); } }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  @keyframes sprout { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  @keyframes cheer { 0%, 100% { transform: none; } 15% { transform: scale(1.07, .9); } 45% { transform: translateY(-58px) scale(.95, 1.08); } 75% { transform: scale(1.08, .9); } }
  @keyframes shadCheer { 45% { transform: scale(.65); } }
  @keyframes up { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  @keyframes upL { from { transform: rotate(35deg); } to { transform: rotate(60deg); } }
  @keyframes boing { 20% { transform: scale(1.18, .8); } 45% { transform: scale(.88, 1.14); } 70% { transform: scale(1.05, .96); } }

  .bubble { position: absolute; top: 0; right: 0; z-index: 2; max-width: 62%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 9px 16px; font: 700 .98rem/1.3 "Nunito Sans", sans-serif; box-shadow: var(--shadow); transform-origin: 0 100%; animation: say .5s 1.2s cubic-bezier(.2,1.4,.4,1) both; }
  .bubble.talk { animation: say .4s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes say { from { opacity: 0; transform: scale(.7) translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 520px) { .bubble { top: -10px; font-size: .9rem; padding: 8px 13px; } }

  .sp { position: absolute; border-radius: 50%; background: var(--amber); opacity: 0; animation: float 7s linear infinite; }
  @keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-190px) translateX(24px); opacity: 0; } }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 11px 22px; box-shadow: var(--shadow); text-align: center; animation: up .7s 1.1s both; }
  .stat span { display: block; font-size: .85rem; color: var(--muted); line-height: 1.2; }
  .stat b { font: 800 1.6rem/1.2 "Gabarito", sans-serif; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .ok circle, .ok path { stroke-dashoffset: 0 !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e9a23b"/><path d="M8 22c0-8 5-13 12-13s12 5 12 13c-8 2-16 2-24 0z" fill="#5b2f5f"/><rect x="16" y="22" width="8" height="10" rx="4" fill="#fff"/></svg>
    Mushroom Pre-Order
  </nav>

  <section class="hero">
    <div>
      <h1>Magpa-reserve ng <em>sariwang mushroom</em></h1>
      <p class="lead">Ilagay lang ang pangalan mo at kung ilang kilo ang gusto mo. Mare-record agad ang pre-order mo.</p>

      <div class="card" id="card">
        <form id="form" novalidate>
          <div class="field">
            <label for="pangalan">Pangalan</label>
            <input type="text" id="pangalan" maxlength="80" autocomplete="name" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="field">
            <span class="lbl" id="kl">Ilang kilo?</span>
            <div class="stepper" role="group" aria-labelledby="kl">
              <button type="button" id="minus" aria-label="Bawasan ng kalahating kilo">−</button>
              <div class="val"><input type="number" id="kilo" min="0.5" max="500" step="0.5" value="1" inputmode="decimal" aria-labelledby="kl"><span>kilo</span></div>
              <button type="button" id="plus" aria-label="Dagdagan ng kalahating kilo">+</button>
            </div>
            <div class="chips" id="chips"></div>
          </div>
          <p class="err" id="err" role="alert"></p>
          <button class="go" id="go" type="submit"><i class="spin"></i><span id="goTxt">I-reserve ang order ko</span></button>
        </form>

        <div class="ok" id="ok" aria-live="polite">
          <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="27"/><path d="M30 43l9 9 16-18"/></svg>
          <h2 id="okH">Salamat!</h2>
          <p id="okP"></p>
          <button class="again" id="again" type="button">Mag-order ulit</button>
        </div>
      </div>
    </div>

    <div class="stage">
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 420 380" id="moki">
        <ellipse class="shadow" cx="210" cy="337" rx="112" ry="14" fill="#5b2f5f" opacity=".16"/>
      <g transform="translate(58 247) scale(1)"><g class="fr-in i1"><g class="bob b1">
        <rect x="-15" y="34" width="30" height="44" rx="15" fill="var(--stem)"/>
        <path d="M-38 40C-38 4-20-14 0-14S38 4 38 40Q0 52-38 40Z" fill="#b5835f"/>
        <circle cx="-14" cy="12" r="6" fill="#fff" opacity=".75"/><circle cx="12" cy="6" r="5" fill="#fff" opacity=".75"/><circle cx="21" cy="27" r="4" fill="#fff" opacity=".75"/>
        <circle cx="-6" cy="56" r="3" fill="#2b1d2f"/><circle cx="6" cy="56" r="3" fill="#2b1d2f"/>
        <circle cx="-12" cy="62" r="3" fill="#ff8fab" opacity=".6"/><circle cx="12" cy="62" r="3" fill="#ff8fab" opacity=".6"/>
        <path d="M-4 62q4 4 8 0" fill="none" stroke="#2b1d2f" stroke-width="2.2" stroke-linecap="round"/>
      </g></g></g>
      <g transform="translate(362 252) scale(0.82)"><g class="fr-in i2"><g class="bob b2">
        <rect x="-15" y="34" width="30" height="44" rx="15" fill="var(--stem)"/>
        <path d="M-38 40C-38 4-20-14 0-14S38 4 38 40Q0 52-38 40Z" fill="#e9a23b"/>
        <circle cx="-14" cy="12" r="6" fill="#fff" opacity=".75"/><circle cx="12" cy="6" r="5" fill="#fff" opacity=".75"/><circle cx="21" cy="27" r="4" fill="#fff" opacity=".75"/>
        <circle cx="-6" cy="56" r="3" fill="#2b1d2f"/><circle cx="6" cy="56" r="3" fill="#2b1d2f"/>
        <circle cx="-12" cy="62" r="3" fill="#ff8fab" opacity=".6"/><circle cx="12" cy="62" r="3" fill="#ff8fab" opacity=".6"/>
        <path d="M-4 62q4 4 8 0" fill="none" stroke="#2b1d2f" stroke-width="2.2" stroke-linecap="round"/>
      </g></g></g>
        <g class="enter"><g class="hop"><g class="squish">
          <ellipse cx="186" cy="326" rx="21" ry="9" fill="#d9c5a8"/><ellipse cx="234" cy="326" rx="21" ry="9" fill="#d9c5a8"/>
          <path d="M152 205Q147 322 210 324Q273 322 268 205Z" fill="var(--stem)"/>
          <g class="armL"><path d="M154 254Q128 262 122 290" fill="none" stroke="#d9c5a8" stroke-width="17" stroke-linecap="round"/><path d="M154 254Q128 262 122 290" fill="none" stroke="var(--stem)" stroke-width="10" stroke-linecap="round"/></g>
          <g class="armR"><path d="M266 252Q296 246 304 216" fill="none" stroke="#d9c5a8" stroke-width="17" stroke-linecap="round"/><path d="M266 252Q296 246 304 216" fill="none" stroke="var(--stem)" stroke-width="10" stroke-linecap="round"/></g>
          <path d="M72 200Q210 232 348 200Q346 214 210 244Q74 214 72 200Z" fill="#e8d3b8"/>
          <path d="M72 200C72 105 135 58 210 58S348 105 348 200Q210 232 72 200Z" fill="#7a3d80"/>
          <circle cx="138" cy="128" r="17" fill="#fff" opacity=".88"/><circle cx="228" cy="100" r="13" fill="#fff" opacity=".88"/><circle cx="284" cy="152" r="16" fill="#fff" opacity=".88"/><circle cx="192" cy="160" r="10" fill="#fff" opacity=".88"/>
          <ellipse cx="146" cy="98" rx="30" ry="12" transform="rotate(-32 146 98)" fill="#fff" opacity=".16"/>
          <g class="sprout"><path d="M210 64Q207 44 210 32" fill="none" stroke="#4f9a5a" stroke-width="4" stroke-linecap="round"/><path d="M210 38q-18-16-32-2 14 16 32 2z" fill="#5fb36a"/><path d="M210 38q18-16 32-2-14 16-32 2z" fill="#4f9a5a"/></g>
          <ellipse cx="164" cy="289" rx="12" ry="7" fill="#ff8fab" opacity=".55"/><ellipse cx="256" cy="289" rx="12" ry="7" fill="#ff8fab" opacity=".55"/>
          <g class="look" id="look">
            <g class="eyes-open"><g class="eye"><circle cx="186" cy="270" r="11" fill="#2b1d2f"/><circle cx="189.5" cy="266" r="3.6" fill="#fff"/></g><g class="eye"><circle cx="234" cy="270" r="11" fill="#2b1d2f"/><circle cx="237.5" cy="266" r="3.6" fill="#fff"/></g></g>
            <g class="eyes-happy" fill="none" stroke="#2b1d2f" stroke-width="4.5" stroke-linecap="round"><path d="M175 272q11-13 22 0"/><path d="M223 272q11-13 22 0"/></g>
          </g>
          <path class="mouth" d="M200 286q10 9 20 0" fill="none" stroke="#2b1d2f" stroke-width="3.6" stroke-linecap="round"/>
          <g class="mouth-open"><path d="M198 283q12 22 24 0z" fill="#7a2a45"/><ellipse cx="210" cy="294" rx="6" ry="3.2" fill="#ff8fab"/></g>
        </g></g></g>
      </svg>
      <div class="bubble" id="say"><span id="sayTxt">Hi! Ako si Moki.</span></div>
      <i class="sp" style="left:22%;bottom:40%;width:8px;height:8px;animation-delay:0s"></i>
      <i class="sp" style="left:48%;bottom:50%;width:6px;height:6px;animation-delay:1.8s"></i>
      <i class="sp" style="left:70%;bottom:38%;width:9px;height:9px;animation-delay:3.2s"></i>
      <i class="sp" style="left:36%;bottom:58%;width:5px;height:5px;animation-delay:4.6s"></i>
      <i class="sp" style="left:82%;bottom:52%;width:7px;height:7px;animation-delay:2.4s"></i>
    </div>
    <div class="stats">
      <div class="stat"><span>Nag-pre-order</span><b id="sOrders">-</b></div>
      <div class="stat"><span>Kabuuang kilo</span><b id="sKilos">-</b></div>
    </div>
    </div>
  </section>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwEyslb4CL9VNEOvNQSEiO6DNQje2JX_hWcJ2jZouZluXZ4PJII-Y0ZKY_-YH8O3Wiujw/exec';

  const $ = id => document.getElementById(id);
  const kilo = $('kilo'), err = $('err'), go = $('go');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Mga mabilisang pili
  [1, 2, 5, 10].forEach(n => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = n + ' kilo';
    b.onclick = () => setKilo(n); $('chips').appendChild(b);
  });

  function setKilo(v) {
    v = Math.min(500, Math.max(0.5, Math.round(v * 2) / 2));
    kilo.value = v; syncChips();
    say(v >= 10 ? 'Wow, ' + v + ' kilo! Marami!' : v + ' kilo. Sige!');
    kilo.classList.remove('bump'); void kilo.offsetWidth; kilo.classList.add('bump');
  }
  function syncChips() { [...$('chips').children].forEach((c, i) => c.classList.toggle('on', Number(kilo.value) === [1, 2, 5, 10][i])); }
  $('minus').onclick = () => setKilo((Number(kilo.value) || 1) - 0.5);
  $('plus').onclick = () => setKilo((Number(kilo.value) || 0) + 0.5);
  kilo.addEventListener('input', syncChips);
  syncChips();

  function countUp(el, to, dec) {
    const fmt = v => dec ? v.toFixed(1).replace(/\.0$/, '') : Math.round(v);
    if (reduce || !to) { el.textContent = fmt(to || 0); return; }
    const t0 = performance.now();
    (function step(t) {
      const p = Math.min((t - t0) / 800, 1);
      el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  async function loadStats() {
    try {
      const d = await (await fetch(API_URL)).json();
      countUp($('sOrders'), d.orders || 0, false);
      countUp($('sKilos'), d.kilos || 0, true);
    } catch (e) { /* hindi kritikal ang stats */ }
  }

  function showErr(msg) {
    err.textContent = msg; err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
    say(msg.startsWith('Hindi na-save') ? 'Naku, hindi na-save. Subukan ulit!' : 'Oops, may kulang pa!');
  }

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = $('pangalan').value.trim(), k = Number(kilo.value);
    err.textContent = '';
    if (!name) { showErr('Ilagay ang pangalan mo.'); $('pangalan').focus(); return; }
    if (!(k >= 0.5 && k <= 500)) { showErr('Ilagay ang kilo, mula 0.5 hanggang 500.'); kilo.focus(); return; }

    go.disabled = true; go.classList.add('busy'); $('goTxt').textContent = 'Sine-save…'; say('Sandali lang, sine-save ko…');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pangalan: name, kilo: k })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      $('okH').textContent = 'Salamat, ' + name.split(' ')[0] + '!';
      $('okP').innerHTML = '';
      $('okP').append('Na-reserve na ang ', Object.assign(document.createElement('strong'), { textContent: k + ' kilo' }), ' na mushroom para sa iyo.');
      $('card').classList.add('done');
      cheer(name.split(' ')[0]);
      loadStats();
    } catch (e) {
      showErr('Hindi na-save: ' + e.message);
    } finally {
      go.disabled = false; go.classList.remove('busy'); $('goTxt').textContent = 'I-reserve ang order ko';
    }
  });

  $('again').onclick = () => {
    $('card').classList.remove('done'); $('pangalan').value = ''; setKilo(1); $('pangalan').focus();
  };

  // ---- Si Moki ----
  const moki = $('moki'), look = $('look'), bubble = $('say'), sayTxt = $('sayTxt');
  let joyTimer;
  function say(t) {
    sayTxt.textContent = t;
    bubble.classList.remove('talk'); void bubble.offsetWidth; bubble.classList.add('talk');
  }
  function joy(cls, ms) {
    moki.classList.remove('joy', 'happy', 'poke'); void moki.getBoundingClientRect();
    moki.classList.add('joy', cls);
    clearTimeout(joyTimer); joyTimer = setTimeout(() => moki.classList.remove('joy', cls), ms);
  }
  function cheer(first) { say('Salamat, ' + first + '! Yehey!'); joy('happy', 2600); }

  const pokes = ['Hihi, kiliti!', 'Boing!', 'Huy, hindi pa ako luto!', 'Uy, nag-hello ka!'];
  let pi = 0;
  moki.addEventListener('click', () => { say(pokes[pi++ % pokes.length]); joy('poke', 700); });

  // Sinusundan ng mata ni Moki ang cursor
  if (!reduce) addEventListener('pointermove', e => {
    const r = look.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 220);
    look.style.transform = `translate(${dx / d * 5 * m}px, ${dy / d * 4 * m}px)`;
  });

  $('pangalan').addEventListener('focus', () => say('Anong pangalan mo?'));
  $('pangalan').addEventListener('change', e => {
    const f = e.target.value.trim().split(' ')[0];
    if (f) say('Hi, ' + f + '! Ang ganda ng pangalan mo.');
  });
  kilo.addEventListener('focus', () => say('Ilang kilo ang gusto mo?'));

  loadStats();
</script>
</body>
</html>
