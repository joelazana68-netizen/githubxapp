<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GITHUBXAPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#1633b8; --deep:#0e2290; --yellow:#ffd23f; --red:#ff3d57; --paper:#fffdf6; --ink:#0b1033; --mint:#7be0b0; --sky:#9fd0ff; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink); font: 400 16px/1.5 "DM Sans", system-ui, sans-serif;
    background: repeating-linear-gradient(135deg, var(--blue) 0 28px, var(--deep) 28px 56px);
    background-size: 200% 200%; animation: drift 24s linear infinite; min-height: 100vh; overflow-x: hidden;
  }
  @keyframes drift { to { background-position: 112px 112px; } }

  /* HERO */
  header { padding: 56px 20px 28px; text-align: center; }
  h1 { margin: 0; font: 400 clamp(2.4rem, 10vw, 6rem)/1 "Bowlby One", Impact, sans-serif; color: var(--paper); letter-spacing: .01em; }
  h1 span {
    display: inline-block; text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--red);
    animation: drop .9s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * 70ms);
    transition: transform .25s;
  }
  h1 span:hover { transform: translateY(-10px) rotate(-6deg) scale(1.12); color: var(--yellow); }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-140%) rotate(-18deg) scale(.6); }
    to { opacity: 1; transform: none; }
  }
  .tag { margin: 18px auto 0; color: var(--paper); font-weight: 700; max-width: 34ch; animation: fade .8s .9s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* RIBBON */
  .ribbon { background: var(--yellow); border-block: 4px solid var(--ink); transform: rotate(-1.6deg) scale(1.04); margin: 12px 0 36px; overflow: hidden; white-space: nowrap; }
  .ribbon div { display: inline-block; padding: 9px 0; font: 400 1.05rem "Bowlby One", Impact, sans-serif; animation: run 22s linear infinite; }
  .ribbon b { margin: 0 22px; color: var(--red); }
  @keyframes run { to { transform: translateX(-50%); } }

  /* LAYOUT */
  main { max-width: 1040px; margin: 0 auto; padding: 0 20px 72px; display: grid; gap: 36px; align-items: start; }
  @media (min-width: 900px) { main { grid-template-columns: 380px 1fr; } .formcard { position: sticky; top: 24px; } }

  /* FORM */
  .formcard {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; padding: 24px;
    box-shadow: 10px 10px 0 var(--yellow), 10px 10px 0 4px var(--ink);
    animation: rise .8s .5s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(60px) rotate(2deg); } to { opacity: 1; transform: none; } }
  .formcard h2 { margin: 0 0 16px; font: 400 1.5rem "Bowlby One", Impact, sans-serif; }
  form { display: grid; gap: 16px; }
  label { font-weight: 700; display: grid; gap: 6px; }
  input, textarea {
    font: inherit; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 11px 12px;
    transition: transform .18s, box-shadow .18s, background .18s;
  }
  textarea { min-height: 104px; resize: vertical; }
  input:focus, textarea:focus { outline: none; transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--red); background: #fffbe8; }
  button {
    position: relative; overflow: hidden; font: 400 1.15rem "Bowlby One", Impact, sans-serif; color: var(--ink);
    background: var(--yellow); border: 3px solid var(--ink); border-radius: 12px; padding: 14px 18px; cursor: pointer;
    box-shadow: 6px 6px 0 var(--ink); transition: transform .12s, box-shadow .12s;
  }
  button::after {
    content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
    transform: translateX(-120%); transition: transform .6s;
  }
  button:hover::after { transform: translateX(120%); }
  button:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
  button:active { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { cursor: wait; background: var(--sky); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px dashed var(--red); outline-offset: 3px; }
  #status { margin: 0; min-height: 1.5em; font-weight: 700; }
  #status.ok { color: #0a7a4a; animation: bounce .5s; }
  #status.err { color: #c4132d; animation: shake .4s; }
  @keyframes bounce { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* WALL */
  .wallhead { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; color: var(--paper); }
  .wallhead h2 { margin: 0; font: 400 1.7rem "Bowlby One", Impact, sans-serif; text-shadow: 3px 3px 0 var(--ink); }
  .count { background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 700; }
  #list { display: grid; gap: 22px; }
  .entry {
    --r: -1.2deg; position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 18px;
    background: var(--paper); border: 4px solid var(--ink); border-radius: 14px; box-shadow: 7px 7px 0 var(--ink);
    transform: rotate(var(--r)); animation: pop .7s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i) * 80ms);
    transition: transform .25s cubic-bezier(.2,1.5,.4,1), box-shadow .25s;
  }
  .entry:nth-child(even) { --r: 1deg; }
  .entry:nth-child(3n) { --r: .4deg; }
  .entry:hover { transform: rotate(0) translateY(-6px) scale(1.02); box-shadow: 12px 12px 0 var(--ink); }
  @keyframes pop { from { opacity: 0; transform: translateY(50px) rotate(calc(var(--r) * 6)) scale(.85); } to { opacity: 1; transform: rotate(var(--r)); } }
  .av { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font: 400 1.25rem "Bowlby One", Impact, sans-serif; background: var(--yellow); transition: transform .4s; }
  .entry:hover .av { transform: rotate(360deg); }
  .entry:nth-child(4n+2) .av { background: var(--mint); }
  .entry:nth-child(4n+3) .av { background: var(--sky); }
  .entry:nth-child(4n) .av { background: var(--red); color: #fff; }
  .msg { margin: 0 0 8px; font-size: 1.1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .who { font-weight: 700; }
  .meta { font-size: .85rem; color: #4a5078; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .meta svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
  .empty { background: var(--paper); border: 4px dashed var(--ink); border-radius: 14px; padding: 28px; text-align: center; font-weight: 700; animation: pop .6s both; }
  .sk { height: 104px; border: 4px solid var(--ink); border-radius: 14px; background: linear-gradient(100deg, #e9e6d6 30%, #fffdf6 50%, #e9e6d6 70%) 0 0 / 300% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -300% 0; } }

  /* CONFETTI */
  .bit { position: fixed; z-index: 50; width: 10px; height: 14px; border: 2px solid var(--ink); pointer-events: none; animation: burst 1.1s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--rot)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="title" aria-label="GITHUBXAPP"></h1>
  <p class="tag">Mag-iwan ng mensahe. Diretso itong mase-save sa Google Sheet.</p>
</header>

<div class="ribbon" aria-hidden="true">
  <div id="run"></div>
</div>

<main>
  <section class="formcard">
    <h2>Isulat mo dito</h2>
    <form id="form">
      <label>Pangalan <input id="pangalan" maxlength="80" required autocomplete="name"></label>
      <label>Address <input id="address" maxlength="150" required autocomplete="street-address"></label>
      <label>Mensahe <textarea id="mensahe" maxlength="500" required></textarea></label>
      <button id="send" type="submit">I-save sa Sheet</button>
      <p id="status" role="status"></p>
    </form>
  </section>

  <section>
    <div class="wallhead"><h2>Pader ng mensahe</h2><span class="count" id="count">0</span></div>
    <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </section>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbziDZbzsWxvar1anW6ZnS0SS36fu0Y6GfOlnmnU6fr0-1EXGgAUcz0Ntbgpr432k96KkQ/exec';

  const form = document.getElementById('form');
  const statusEl = document.getElementById('status');
  const list = document.getElementById('list');
  const sendBtn = document.getElementById('send');
  const countEl = document.getElementById('count');

  // Title letters + ribbon
  const t = document.getElementById('title');
  'GITHUBXAPP'.split('').forEach((ch, i) => {
    const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true'); t.appendChild(s);
  });
  const phrase = ['MAG-IWAN NG MENSAHE', 'NASA SHEET LAHAT', 'LIBRE AT MABILIS'];
  const run = document.getElementById('run');
  const chunk = phrase.map(p => p + '<b>✦</b>').join('');
  run.innerHTML = chunk.repeat(4);

  const PIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>';

  function render(entries) {
    list.textContent = '';
    countEl.textContent = entries.length;
    if (!entries.length) {
      const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Wala pang laman. Ikaw ang una!'; list.appendChild(d); return;
    }
    entries.forEach((e, i) => {
      const card = document.createElement('article'); card.className = 'entry'; card.style.setProperty('--i', Math.min(i, 12));
      const av = document.createElement('div'); av.className = 'av'; av.textContent = (e.pangalan || '?').trim().charAt(0).toUpperCase();
      const body = document.createElement('div');
      const p = document.createElement('p'); p.className = 'msg'; p.textContent = e.mensahe;
      const meta = document.createElement('div'); meta.className = 'meta';
      const who = document.createElement('span'); who.className = 'who'; who.textContent = e.pangalan;
      meta.appendChild(who);
      if (e.address) { const a = document.createElement('span'); a.innerHTML = PIN; a.append(e.address); meta.appendChild(a); }
      const d = document.createElement('span'); d.textContent = new Date(e.petsa).toLocaleString('fil-PH'); meta.appendChild(d);
      body.append(p, meta); card.append(av, body); list.appendChild(card);
    });
  }

  async function load() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      render(data.entries || []);
    } catch (err) {
      list.innerHTML = '';
      const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Hindi ma-load. Tingnan kung tama ang API_URL.'; list.appendChild(d);
    }
  }

  function confetti(x, y) {
    const colors = ['#ffd23f', '#ff3d57', '#7be0b0', '#9fd0ff', '#fffdf6'];
    for (let i = 0; i < 34; i++) {
      const b = document.createElement('i'); b.className = 'bit';
      const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 190;
      b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.background = colors[i % colors.length];
      b.style.setProperty('--x', Math.cos(ang) * dist + 'px'); b.style.setProperty('--y', Math.sin(ang) * dist + 80 + 'px');
      b.style.setProperty('--rot', Math.random() * 720 - 360 + 'deg');
      document.body.appendChild(b); setTimeout(() => b.remove(), 1200);
    }
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    sendBtn.disabled = true; statusEl.className = ''; statusEl.textContent = 'Sine-save…';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          pangalan: document.getElementById('pangalan').value,
          address: document.getElementById('address').value,
          mensahe: document.getElementById('mensahe').value
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      const r = sendBtn.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
      form.reset();
      statusEl.className = 'ok'; statusEl.textContent = 'Na-save na!';
      load();
    } catch (err) {
      statusEl.className = 'err'; statusEl.textContent = 'May error: ' + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
