<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushroom Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0ecf1; --surface:#fff; --ink:#2b1d2f; --muted:#6c5d70; --line:#ddd3df; --plum:#5b2f5f; --on-plum:#fff;
    --amber:#e9a23b; --cap:#8a4f3a; --stem:#efe3d2; --soft:#f6f1f7; --danger:#b3261e;
    --shadow:0 2px 4px rgba(43,29,47,.06), 0 16px 40px rgba(43,29,47,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161018; --surface:#221826; --ink:#f3ebf5; --muted:#b3a3b8; --line:#382a3d; --plum:#d9a6dd; --on-plum:#24112a;
      --amber:#f0b24b; --cap:#a8644c; --stem:#e6d8c6; --soft:#2b2030; --danger:#ff8a80; --shadow:0 2px 4px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 17px/1.55 "Nunito Sans", system-ui, sans-serif; overflow-x: hidden; }
  h1, h2 { font-family: "Gabarito", system-ui, sans-serif; margin: 0; letter-spacing: -.015em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

  nav { display: flex; align-items: center; gap: 10px; padding: 24px 0; font: 800 1.15rem "Gabarito", sans-serif; animation: down .6s both; }
  nav svg { width: 34px; height: 34px; }
  @keyframes down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  .hero { display: grid; gap: 36px; align-items: center; padding: 12px 0 72px; }
  @media (min-width: 900px) { .hero { grid-template-columns: 1.05fr 1fr; gap: 56px; padding-top: 28px; } }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.04; font-weight: 800; animation: up .7s .1s both; }
  h1 em { font-style: normal; color: var(--plum); }
  .lead { color: var(--muted); font-size: 1.1rem; margin: 14px 0 26px; max-width: 46ch; animation: up .7s .2s both; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); max-width: 480px; animation: up .7s .3s both; }
  form { display: grid; gap: 20px; }
  label, .lbl { font-weight: 700; font-size: .98rem; display: block; margin-bottom: 7px; transition: color .2s; }
  .field:focus-within > label { color: var(--plum); }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--soft); border: 2px solid transparent; border-radius: 13px; padding: 14px 16px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder { color: #9a8b9f; }
  input:focus { outline: none; border-color: var(--plum); background: var(--surface); box-shadow: 0 0 0 5px color-mix(in srgb, var(--plum) 16%, transparent); }

  .stepper { display: flex; align-items: center; background: var(--soft); border-radius: 13px; padding: 5px; border: 2px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stepper:focus-within { border-color: var(--plum); box-shadow: 0 0 0 5px color-mix(in srgb, var(--plum) 16%, transparent); }
  .stepper button { width: 46px; height: 46px; flex: none; border: 0; border-radius: 10px; background: var(--surface); color: var(--plum); font: 800 1.5rem "Gabarito", sans-serif; cursor: pointer; box-shadow: 0 1px 3px rgba(43,29,47,.15); transition: transform .12s, background .2s, color .2s; }
  .stepper button:hover { background: var(--plum); color: var(--on-plum); }
  .stepper button:active { transform: scale(.88); }
  .stepper .val { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .stepper input { width: 5.2ch; text-align: center; font: 800 1.9rem "Gabarito", sans-serif; background: transparent; border: 0; padding: 4px 0; box-shadow: none; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { box-shadow: none; background: transparent; }
  .stepper .val span { color: var(--muted); font-weight: 700; }
  .bump { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.25); color: var(--plum); } }

  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font: 700 .95rem "Nunito Sans", sans-serif; padding: 7px 14px; border: 2px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--plum); transform: translateY(-2px); }
  .chip.on { background: var(--plum); color: var(--on-plum); border-color: var(--plum); }

  .go {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    font: 800 1.15rem "Gabarito", sans-serif; background: var(--plum); color: var(--on-plum); border: 0; border-radius: 14px; padding: 16px; cursor: pointer;
    box-shadow: 0 10px 24px color-mix(in srgb, var(--plum) 35%, transparent); transition: transform .15s, filter .2s;
  }
  .go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s; }
  .go:hover::after { transform: translateX(120%); }
  .go:hover { transform: translateY(-2px); }
  .go:active { transform: scale(.98); }
  .go:disabled { cursor: wait; filter: opacity(.8); transform: none; }
  .go:focus-visible, .stepper button:focus-visible, .chip:focus-visible, .again:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .spin { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; display: none; }
  .busy .spin { display: block; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .err { margin: 0; min-height: 1.4em; color: var(--danger); font-weight: 700; font-size: .95rem; }
  .err.show { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* SUCCESS */
  .ok { display: none; text-align: center; padding: 10px 0; }
  .done form { display: none; }
  .done .ok { display: block; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(16px); } to { opacity: 1; transform: none; } }
  .ok svg { width: 84px; height: 84px; }
  .ok circle { fill: none; stroke: var(--plum); stroke-width: 5; stroke-dasharray: 170; stroke-dashoffset: 170; animation: draw .7s .1s forwards; }
  .ok path { fill: none; stroke: var(--plum); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .5s .6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ok h2 { font-size: 1.6rem; margin: 10px 0 6px; }
  .ok p { margin: 0 0 20px; color: var(--muted); }
  .ok strong { color: var(--ink); }
  .again { font: 700 1rem "Nunito Sans", sans-serif; background: transparent; color: var(--plum); border: 2px solid var(--plum); border-radius: 12px; padding: 11px 20px; cursor: pointer; transition: background .2s, color .2s; }
  .again:hover { background: var(--plum); color: var(--on-plum); }

  /* ART - hardin ng mga mushroom */
  .stage { display: grid; gap: 14px; justify-items: center; }
  .art { position: relative; aspect-ratio: 1 / .92; max-width: 520px; width: 100%; }
  .art::before { content: ""; position: absolute; inset: 10% 4% 2%; border-radius: 50%; background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--amber) 30%, transparent), transparent 68%); }
  .art svg { position: relative; width: 100%; height: 100%; overflow: visible; }
  .enter, .hop, .squish, .fr-in, .bob { transform-box: fill-box; transform-origin: 50% 100%; }
  .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s 2s infinite; }
  .foot { transform-box: fill-box; transform-origin: 50% 100%; }
  .enter { animation: mIn .9s .3s cubic-bezier(.2,1.4,.4,1) both; }
  .squish { animation: breathe 3s ease-in-out infinite alternate; }
  .look { transition: transform .12s ease-out; }
  .armR { transform-origin: 266px 252px; animation: wave 6s 1.6s infinite; }
  .armL { transform-origin: 154px 254px; animation: sway 3s ease-in-out infinite alternate; }
  .sprout { transform-origin: 210px 62px; animation: sprout 2.8s ease-in-out infinite alternate; }
  .fr-in { animation: mIn .8s cubic-bezier(.2,1.4,.4,1) both; } .i1 { animation-delay: .9s; } .i2 { animation-delay: 1.1s; } .i3 { animation-delay: 1.3s; }
  .bob { animation: bob 2.4s ease-in-out infinite alternate; } .b2 { animation-duration: 2.9s; animation-delay: -1.2s; } .b3 { animation-duration: 2.1s; animation-delay: -.7s; }
  .eyes-happy, .mouth-open { display: none; }

  /* Si Moki - malayang gumagala */
  #pet { position: fixed; left: 0; top: 0; z-index: 50; width: 130px; height: 139px; pointer-events: none; touch-action: none; will-change: transform; }
  #pet.off { display: none; }
  #pet svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; touch-action: none; }
  #pet svg * { pointer-events: auto; touch-action: none; cursor: grab; }
  #moki.held * { cursor: grabbing; }
  #moki.joy .eyes-open { display: none; }
  #moki.joy .eyes-happy { display: block; }
  #moki.joy .mouth, #moki.held .mouth { display: none; }
  #moki.joy .mouth-open, #moki.held .mouth-open { display: block; }
  #moki.walk .squish { animation: waddle .34s ease-in-out infinite; }
  #moki.walk .footL { animation: step .34s ease-in-out infinite; }
  #moki.walk .footR { animation: step .34s -.17s ease-in-out infinite; }
  #moki.walk .armR { animation: swing .34s ease-in-out infinite alternate; }
  #moki.walk .armL { animation: swing .34s ease-in-out infinite alternate-reverse; }
  #moki.air .squish, #moki.held .squish { animation: none; }
  #moki.air .armR { animation: none; transform: rotate(-35deg); }
  #moki.air .armL { animation: none; transform: rotate(45deg); }
  #moki.held .armR { animation: flail .25s ease-in-out infinite alternate; }
  #moki.held .armL { animation: flailL .25s ease-in-out infinite alternate; }
  #moki.held .foot { transform-origin: 50% 0; animation: dangle .45s ease-in-out infinite alternate; }
  #moki.held .footR { animation-direction: alternate-reverse; animation-delay: -.2s; }
  #moki.happy .armR { animation: armUp .3s ease-in-out infinite alternate; }
  #moki.happy .armL { animation: armUpL .3s ease-in-out infinite alternate; }
  #moki.poke .squish { animation: boing .65s; }
  @keyframes mIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes breathe { from { transform: scale(1.012, .988); } to { transform: scale(.992, 1.01); } }
  @keyframes wave { 0%, 30%, 100% { transform: rotate(0); } 4%, 12%, 20% { transform: rotate(-20deg); } 8%, 16%, 24% { transform: rotate(14deg); } }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  @keyframes sprout { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  @keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes waddle { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg) translateY(-3px); } }
  @keyframes swing { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  @keyframes flail { from { transform: rotate(-50deg); } to { transform: rotate(-15deg); } }
  @keyframes flailL { from { transform: rotate(60deg); } to { transform: rotate(25deg); } }
  @keyframes dangle { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  @keyframes armUp { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  @keyframes armUpL { from { transform: rotate(35deg); } to { transform: rotate(60deg); } }
  @keyframes boing { 20% { transform: scale(1.18, .8); } 45% { transform: scale(.88, 1.14); } 70% { transform: scale(1.05, .96); } }

  .bubble { position: fixed; left: 8px; top: 8px; z-index: 60; pointer-events: none; max-width: min(260px, 80vw); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 9px 16px; font: 700 .95rem/1.3 "Nunito Sans", sans-serif; box-shadow: var(--shadow); transform-origin: 0 100%; transition: opacity .3s; animation: say .4s cubic-bezier(.2,1.4,.4,1) backwards; }
  .bubble.off { opacity: 0; }
  @keyframes say { from { opacity: 0; transform: scale(.7) translateY(6px); } to { opacity: 1; transform: none; } }
  .ptog { margin-left: auto; white-space: nowrap; flex: none; font: 700 .85rem "Nunito Sans", sans-serif; color: var(--plum); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: border-color .2s; }
  .ptog:hover { border-color: var(--plum); }
  .ptog:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  .sp { position: absolute; border-radius: 50%; background: var(--amber); opacity: 0; animation: float 7s linear infinite; }
  @keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-190px) translateX(24px); opacity: 0; } }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 11px 22px; box-shadow: var(--shadow); text-align: center; animation: up .7s 1.1s both; }
  .stat span { display: block; font-size: .85rem; color: var(--muted); line-height: 1.2; }
  .stat b { font: 800 1.6rem/1.2 "Gabarito", sans-serif; }

  /* Sales talk ni Moki */
  .bubble.sell { pointer-events: auto; min-width: 220px; max-width: min(310px, 88vw); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .opts:empty { display: none; }
  .opts button { font: 700 .85rem "Nunito Sans", sans-serif; padding: 6px 12px; border: 2px solid var(--plum); background: transparent; color: var(--plum); border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }
  .opts button:hover, .opts button.main { background: var(--plum); color: var(--on-plum); }
  .opts button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .mouth-sad, .tear { display: none; }
  .tear { transform-box: fill-box; }
  #moki.sad .mouth, #moki.sad .mouth-open { display: none; }
  #moki.sad .mouth-sad, #moki.sad .tear { display: block; }
  #moki.sad .tear { animation: tear 1.1s ease-in infinite; }
  @keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(16px); opacity: 0; } }

  /* Ayos ng form: tuwid at magkakapantay */
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { text-align: center; padding: 8px 0; white-space: nowrap; }
  .stepper .val { align-items: center; }
  .stepper .val span { line-height: 1; }
  .err:empty { display: none; }

  /* Trivia ni Moki */
  nav { flex-wrap: wrap; }
  .tgb { margin-left: auto; background: var(--plum); color: var(--on-plum); border-color: var(--plum); }
  .tgb:hover { filter: brightness(1.1); }
  .tgb + .ptog { margin-left: 0; }
  .glasses { display: none; }
  #moki.smart .glasses { display: block; animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
  .bubble.sell .tq { display: block; font: 800 .75rem "Gabarito", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); margin-bottom: 3px; }
  .bubble.sell .opts button { text-align: left; }

  /* Sayaw ni Moki (gantimpala pagkatapos mag-order) */
  #moki.dance .squish { animation: groove .6s ease-in-out infinite; }
  #moki.dance .footL { animation: step .3s ease-in-out infinite; }
  #moki.dance .footR { animation: step .3s -.15s ease-in-out infinite; }
  #moki.dance .armR { animation: armUp .3s ease-in-out infinite alternate; }
  #moki.dance .armL { animation: armUpL .3s -.15s ease-in-out infinite alternate; }
  #moki.dance .sprout { animation: sprout .3s ease-in-out infinite alternate; }
  @keyframes groove { 0% { transform: rotate(-9deg) translate(-10px, 0); } 25% { transform: rotate(0) translate(0, -16px) scale(.96, 1.06); } 50% { transform: rotate(9deg) translate(10px, 0); } 75% { transform: rotate(0) translate(0, -16px) scale(.96, 1.06); } 100% { transform: rotate(-9deg) translate(-10px, 0); } }
  .note { position: fixed; z-index: 55; pointer-events: none; font: 800 1.6rem "Gabarito", sans-serif; color: var(--plum); animation: noteUp 1.8s ease-out forwards; }
  @keyframes noteUp { from { opacity: 0; transform: translateY(0) rotate(-10deg); } 15% { opacity: 1; } to { opacity: 0; transform: translateY(-90px) rotate(14deg); } }
  .confetti { position: fixed; top: -14px; z-index: 55; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .ok circle, .ok path { stroke-dashoffset: 0 !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e9a23b"/><path d="M8 22c0-8 5-13 12-13s12 5 12 13c-8 2-16 2-24 0z" fill="#5b2f5f"/><rect x="16" y="22" width="8" height="10" rx="4" fill="#fff"/></svg>
    Mushroom Pre-Order
    <button class="ptog tgb" id="triviaBtn" type="button">Trivia ni Moki<b id="tScore"></b></button>
    <button class="ptog" id="petToggle" type="button" aria-pressed="true">Itago si Moki</button>
  </nav>

  <section class="hero">
    <div>
      <h1>Magpa-reserve ng <em>sariwang mushroom</em></h1>
      <p class="lead">Ilagay lang ang pangalan mo at kung ilang kilo ang gusto mo. Mare-record agad ang pre-order mo.</p>

      <div class="card" id="card">
        <form id="form" novalidate>
          <div class="field">
            <label for="pangalan">Pangalan</label>
            <input type="text" id="pangalan" maxlength="80" autocomplete="name" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="field">
            <span class="lbl" id="kl">Ilang kilo?</span>
            <div class="stepper" role="group" aria-labelledby="kl">
              <button type="button" id="minus" aria-label="Bawasan ng kalahating kilo">−</button>
              <div class="val"><input type="number" id="kilo" min="0.5" max="500" step="0.5" value="1" inputmode="decimal" aria-labelledby="kl"><span>kilo</span></div>
              <button type="button" id="plus" aria-label="Dagdagan ng kalahating kilo">+</button>
            </div>
            <div class="chips" id="chips"></div>
          </div>
          <p class="err" id="err" role="alert"></p>
          <button class="go" id="go" type="submit"><i class="spin"></i><span id="goTxt">I-reserve ang order ko</span></button>
        </form>

        <div class="ok" id="ok" aria-live="polite">
          <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="27"/><path d="M30 43l9 9 16-18"/></svg>
          <h2 id="okH">Salamat!</h2>
          <p id="okP"></p>
          <button class="again" id="again" type="button">Mag-order ulit</button>
        </div>
      </div>
    </div>

    <div class="stage">
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 420 380">
        <ellipse cx="210" cy="337" rx="190" ry="17" fill="#5b2f5f" opacity=".13"/>
      <g transform="translate(58 247) scale(1)"><g class="fr-in i1"><g class="bob b1">
        <rect x="-15" y="34" width="30" height="44" rx="15" fill="var(--stem)"/>
        <path d="M-38 40C-38 4-20-14 0-14S38 4 38 40Q0 52-38 40Z" fill="#b5835f"/>
        <circle cx="-14" cy="12" r="6" fill="#fff" opacity=".75"/><circle cx="12" cy="6" r="5" fill="#fff" opacity=".75"/><circle cx="21" cy="27" r="4" fill="#fff" opacity=".75"/>
        <circle cx="-6" cy="56" r="3" fill="#2b1d2f"/><circle cx="6" cy="56" r="3" fill="#2b1d2f"/>
        <circle cx="-12" cy="62" r="3" fill="#ff8fab" opacity=".6"/><circle cx="12" cy="62" r="3" fill="#ff8fab" opacity=".6"/>
        <path d="M-4 62q4 4 8 0" fill="none" stroke="#2b1d2f" stroke-width="2.2" stroke-linecap="round"/>
      </g></g></g>
      <g transform="translate(362 252) scale(0.82)"><g class="fr-in i2"><g class="bob b2">
        <rect x="-15" y="34" width="30" height="44" rx="15" fill="var(--stem)"/>
        <path d="M-38 40C-38 4-20-14 0-14S38 4 38 40Q0 52-38 40Z" fill="#e9a23b"/>
        <circle cx="-14" cy="12" r="6" fill="#fff" opacity=".75"/><circle cx="12" cy="6" r="5" fill="#fff" opacity=".75"/><circle cx="21" cy="27" r="4" fill="#fff" opacity=".75"/>
        <circle cx="-6" cy="56" r="3" fill="#2b1d2f"/><circle cx="6" cy="56" r="3" fill="#2b1d2f"/>
        <circle cx="-12" cy="62" r="3" fill="#ff8fab" opacity=".6"/><circle cx="12" cy="62" r="3" fill="#ff8fab" opacity=".6"/>
        <path d="M-4 62q4 4 8 0" fill="none" stroke="#2b1d2f" stroke-width="2.2" stroke-linecap="round"/>
      </g></g></g>
      <g transform="translate(118 287) scale(0.55)"><g class="fr-in i3"><g class="bob b3">

<div class="bubble off" id="say" role="status"><span id="sayTxt">Hi! Ako si Moki.</span><div class="opts" id="sayOpts"></div></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwEyslb4CL9VNEOvNQSEiO6DNQje2JX_hWcJ2jZouZluXZ4PJII-Y0ZKY_-YH8O3Wiujw/exec';

  // ---- Sales talk ni Moki: punan lang ng TOTOONG detalye. Kapag walang laman, hindi ito babanggitin. ----
  // Huwag maglagay ng hindi totoo (hal. pekeng "limited stock"), mawawalan ng tiwala ang customer.
  const SALES = {
    pricePerKilo: 0,   // hal. 180 -> sasabihin ni Moki kung magkano ang dagdag na kilo
    bulkNote: '',      // hal. 'Libreng delivery sa 3 kilo pataas'
    freshNote: ''      // hal. 'Pinipitas namin ito kaninang umaga'
  };
  let STATS = { orders: 0, kilos: 0 };

  const $ = id => document.getElementById(id);
  const kilo = $('kilo'), err = $('err'), go = $('go');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Mga mabilisang pili
  [1, 2, 5, 10].forEach(n => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = n + ' kilo';
    b.onclick = () => setKilo(n); $('chips').appendChild(b);
  });

  function setKilo(v, quiet) {
    v = Math.min(500, Math.max(0.5, Math.round(v * 2) / 2));
    kilo.value = v; syncChips();
    if (!quiet) { say(v >= 10 ? 'Wow, ' + v + ' kilo! Marami!' : v + ' kilo. Sige!'); if (v === 1) pitchSoon('kilo'); }
    kilo.classList.remove('bump'); void kilo.offsetWidth; kilo.classList.add('bump');
  }
  function syncChips() { [...$('chips').children].forEach((c, i) => c.classList.toggle('on', Number(kilo.value) === [1, 2, 5, 10][i])); }
  $('minus').onclick = () => setKilo((Number(kilo.value) || 1) - 0.5);
  $('plus').onclick = () => setKilo((Number(kilo.value) || 0) + 0.5);
  kilo.addEventListener('input', syncChips);
  syncChips();

  function countUp(el, to, dec) {
    const fmt = v => dec ? v.toFixed(1).replace(/\.0$/, '') : Math.round(v);
    if (reduce || !to) { el.textContent = fmt(to || 0); return; }
    const t0 = performance.now();
    (function step(t) {
      const p = Math.min((t - t0) / 800, 1);
      el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  async function loadStats() {
    try {
      const d = await (await fetch(API_URL)).json();
      STATS = { orders: d.orders || 0, kilos: d.kilos || 0 };
      countUp($('sOrders'), d.orders || 0, false);
      countUp($('sKilos'), d.kilos || 0, true);
    } catch (e) { /* hindi kritikal ang stats */ }
  }

  function showErr(msg) {
    err.textContent = msg; err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
    say(msg.startsWith('Hindi na-save') ? 'Naku, hindi na-save. Subukan ulit!' : 'Oops, may kulang pa!');
  }

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = $('pangalan').value.trim(), k = Number(kilo.value);
    err.textContent = '';
    if (!name) { showErr('Ilagay ang pangalan mo.'); $('pangalan').focus(); return; }
    if (!(k >= 0.5 && k <= 500)) { showErr('Ilagay ang kilo, mula 0.5 hanggang 500.'); kilo.focus(); return; }
    if (sell.active) endSell();
    else if (k === 1 && !sell.pitched && !sell.done && M.on) { start('submit'); return; }

    go.disabled = true; go.classList.add('busy'); $('goTxt').textContent = 'Sine-save…'; say('Sandali lang, sine-save ko…');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pangalan: name, kilo: k })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      $('okH').textContent = 'Salamat, ' + name.split(' ')[0] + '!';
      $('okP').innerHTML = '';
      $('okP').append('Na-reserve na ang ', Object.assign(document.createElement('strong'), { textContent: k + ' kilo' }), ' na mushroom para sa iyo.');
      $('card').classList.add('done');
      cheer(name.split(' ')[0]);
      loadStats();
    } catch (e) {
      showErr('Hindi na-save: ' + e.message);
    } finally {
      go.disabled = false; go.classList.remove('busy'); $('goTxt').textContent = 'I-reserve ang order ko';
    }
  });

  $('again').onclick = () => {
    $('card').classList.remove('done'); $('pangalan').value = ''; setKilo(1, true); $('pangalan').focus();
  };

  // ---- Si Moki: malayang gumagala ----
  const pet = $('pet'), moki = $('moki'), look = $('look'), hopG = $('hopG'), bubble = $('say'), sayTxt = $('sayTxt');
  const art = document.querySelector('.art');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const G = 1800;
  let W = 130, H = 139, sayTimer, joyTimer, last = performance.now();
  const M = { x: 0, y: 0, vx: 0, vy: 0, mode: 'air', sup: null, tx: null, goalX: null, sq: 0, idle: 0, next: 3, on: true, minY: null };

  function size() {
    W = innerWidth < 520 ? 100 : 130; H = W * 322 / 300;
    pet.style.width = W + 'px'; pet.style.height = H + 'px';
  }
  const floorY = () => innerHeight - 4;

  const sell = { active: false, pitched: 0, done: false, declines: 0, from: '' };
  function say(t) {
    if (!M.on || sell.active) return;
    sayTxt.textContent = t;
    bubble.classList.remove('off', 'talk'); void bubble.offsetWidth; bubble.classList.add('talk');
    clearTimeout(sayTimer); sayTimer = setTimeout(() => bubble.classList.add('off'), 4200);
  }
  function joy(cls, ms) {
    moki.classList.remove('joy', 'happy', 'poke'); void moki.getBoundingClientRect();
    moki.classList.add('joy', cls);
    clearTimeout(joyTimer); joyTimer = setTimeout(() => moki.classList.remove('joy', cls), ms);
  }
  function hop(v) { if (M.mode === 'ground') { M.minY = null; M.vy = -(v || 620); M.vx = 0; M.mode = 'air'; M.sup = null; M.tx = null; } }
  function cheer(first) {
    say('Salamat, ' + first + '! Yehey!'); joy('happy', 2600);
    [0, 650, 1300].forEach(d => setTimeout(() => hop(700), d));
    setTimeout(() => dance(first), 2000);
  }
  // Sayaw bilang gantimpala sa bumili
  let danceT;
  function confetti() {
    if (reduce) return;
    const cols = ['#5b2f5f', '#e9a23b', '#ff8fab', '#4f9a5a', '#7fc8ff'];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement('i'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
      c.style.animationDuration = 2.4 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 5600);
    }
  }
  function dance(first) {
    if (!M.on || M.mode === 'held') return;
    if (M.mode !== 'ground') { setTimeout(() => dance(first), 300); return; }
    clearTimeout(danceT); M.tx = null; M.idle = -1e9; confetti();
    joy('happy', 6500); moki.classList.add('dance');
    say('Sayaw tayo, ' + first + '! Salamat sa order mo!');
    const iv = setInterval(() => {
      const n = document.createElement('b'); n.className = 'note'; n.textContent = ['♪', '♫'][Math.random() * 2 | 0];
      n.style.left = (M.x - 30 + Math.random() * 60) + 'px'; n.style.top = (M.y - H) + 'px';
      document.body.appendChild(n); setTimeout(() => n.remove(), 1900);
    }, 380);
    danceT = setTimeout(() => { clearInterval(iv); moki.classList.remove('dance'); M.idle = 0; say('Hay, napagod ako! Bumalik ka ulit, ha!'); }, 6500);
  }

  // Mga tuntungan: itaas ng form, heading, stats at hardin
  function platforms() {
    const out = [], vh = innerHeight;
    document.querySelectorAll('.card, .stat, h1').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width > 40 && r.top > 70 && r.top < vh - 40) out.push({ el, l: r.left, r: r.right, top: r.top });
    });
    const r = art.getBoundingClientRect(), gy = r.top + r.height * .885;
    if (gy > 70 && gy < vh - 10) out.push({ el: art, l: r.left + r.width * .1, r: r.right - r.width * .1, top: gy });
    return out;
  }

  function land(sup, y) {
    M.sq = clamp(M.vy / 1400, .2, 1); M.mode = 'ground'; M.sup = sup; M.y = y; M.vx = 0; M.vy = 0; M.minY = null;
    if (M.goalX !== null) { if (Math.abs(M.goalX - M.x) > 8) M.tx = M.goalX; M.goalX = null; }
  }

  function jumpTo(px, ty) {
    if (M.mode !== 'ground') return;
    const dx = px - M.x, dy = ty - M.y;
    const h = clamp(Math.max(90, -dy + 70), 90, 470);
    const vy0 = -Math.sqrt(2 * G * h), disc = vy0 * vy0 + 2 * G * dy;
    const t = disc > 0 ? (-vy0 + Math.sqrt(disc)) / G : -vy0 / G;
    M.vy = vy0; M.vx = clamp(dx / t, -1000, 1000);
    M.mode = 'air'; M.sup = null; M.tx = null; M.goalX = px; M.sq = -.5; M.minY = ty - 25;
  }

  function goTo(px, py) {
    if (!M.on || M.mode === 'held') return;
    const P = platforms(), fl = floorY();
    px = clamp(px, W * .35, innerWidth - W * .35);
    let ty = py, best = 60;
    P.forEach(p => { if (px >= p.l && px <= p.r && Math.abs(py - p.top) < best) { best = Math.abs(py - p.top); ty = p.top; } });
    if (Math.abs(py - fl) < 70) ty = fl;
    M.idle = 0;
    const here = M.sup === 'floor' ? { l: 0, r: innerWidth } : P.find(p => p.el === M.sup);
    if (M.mode === 'ground' && Math.abs(ty - M.y) < 30 && here && px >= here.l && px <= here.r) { M.tx = px; return; }
    jumpTo(px, ty);
  }

  function wander() {
    const P = platforms(), opts = [];
    P.forEach(p => opts.push({ x: p.l + 20 + Math.random() * Math.max(10, p.r - p.l - 40), y: p.top }));
    opts.push({ x: W + Math.random() * Math.max(10, innerWidth - 2 * W), y: floorY() });
    if (Math.random() < .25) { hop(540); return; }
    const o = opts[Math.floor(Math.random() * opts.length)]; goTo(o.x, o.y);
  }

  function step(dt) {
    const P = platforms(), fl = floorY();
    M.sq += (0 - M.sq) * Math.min(1, 9 * dt);
    if (M.mode === 'ground') {
      if (M.sup === 'floor') M.y = fl;
      else {
        const sp = P.find(p => p.el === M.sup);
        if (!sp || M.x < sp.l - 6 || M.x > sp.r + 6) { M.mode = 'air'; M.sup = null; M.vy = 0; }
        else M.y = sp.top;
      }
      if (M.mode === 'ground' && M.tx !== null) {
        const sp = P.find(p => p.el === M.sup);
        if (sp) M.tx = clamp(M.tx, sp.l + 8, sp.r - 8);
        const d = M.tx - M.x, sp2 = (innerWidth < 520 ? 110 : 150) * dt;
        if (Math.abs(d) <= sp2) { M.x = M.tx; M.tx = null; } else M.x += Math.sign(d) * sp2;
      } else if (M.mode === 'ground') {
        M.idle += dt;
        if (M.idle > M.next && !reduce) { M.idle = 0; M.next = 2.5 + Math.random() * 3.5; wander(); }
      }
    } else if (M.mode === 'air') {
      const py = M.y;
      M.vy += G * dt; M.x += M.vx * dt; M.y += M.vy * dt;
      if (M.x < W * .3) { M.x = W * .3; M.vx = Math.abs(M.vx) * .4; }
      if (M.x > innerWidth - W * .3) { M.x = innerWidth - W * .3; M.vx = -Math.abs(M.vx) * .4; }
      if (M.vy > 0) {
        let hit = null;
        P.forEach(p => { if (M.x >= p.l - 4 && M.x <= p.r + 4 && py <= p.top + 3 && M.y >= p.top && (M.minY === null || p.top >= M.minY) && (!hit || p.top < hit.top)) hit = p; });
        if (hit) land(hit.el, hit.top); else if (M.y >= fl) land('floor', fl);
      }
    }
  }

  function render() {
    pet.style.transform = `translate(${M.x - W / 2}px, ${M.y - H + 4}px)`;
    const walking = M.mode === 'ground' && M.tx !== null;
    moki.classList.toggle('walk', walking);
    moki.classList.toggle('air', M.mode === 'air');
    moki.classList.toggle('held', M.mode === 'held');
    let sy = 1, sx = 1;
    if (M.mode === 'air') { const s = Math.min(.2, Math.abs(M.vy) / 5500); sy = 1 + s; sx = 1 - s * .7; }
    sy -= M.sq * .3; sx += M.sq * .22;
    hopG.style.transform = `scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    if (walking) look.style.transform = `translate(${Math.sign(M.tx - M.x) * 5}px, 1px)`;
    if (!bubble.classList.contains('off')) {
      const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
      let bx = clamp(M.x - 24, 8, innerWidth - bw - 8), by = M.y - H - bh - 4;
      if (by < 8) by = Math.min(M.y + 8, innerHeight - bh - 8);
      bubble.style.left = bx + 'px'; bubble.style.top = by + 'px';
    }
  }

  function frame(t) {
    const dt = Math.min(.034, (t - last) / 1000); last = t;
    if (M.on) { step(dt); render(); }
    requestAnimationFrame(frame);
  }

  function spawn(x) { M.x = x; M.y = -H; M.vx = 0; M.vy = 0; M.mode = 'air'; M.sup = null; M.tx = null; M.goalX = null; M.idle = 0; M.minY = null; }

  // Hawakan, ihagis, o pindutin si Moki
  const pokes = ['Hihi, kiliti!', 'Boing!', 'Huy, hindi pa ako luto!', 'Uy, nag-hello ka!'];
  let pi = 0, drag = null;
  function poke() {
    joy('poke', 700); hop(620);
    if (!sell.active && ++pi % 4 === 0) { offer('Alam mo ba, marunong akong mag-trivia! Gusto mo ng tanong tungkol sa kabute?', [['Game!', triviaStart, 1], ['Mamaya na', endSell]]); return; }
    say(pokes[pi % pokes.length]);
  }
  moki.addEventListener('pointerdown', e => {
    e.preventDefault(); moki.classList.remove('dance');
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, lx: e.clientX, ly: e.clientY, lt: performance.now(), vx: 0, vy: 0 };
    moki.setPointerCapture(e.pointerId);
  });
  moki.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 7) { drag.moved = true; M.mode = 'held'; M.sup = null; M.tx = null; M.goalX = null; say('Waaah! Saan mo ako dadalhin?'); }
    if (!drag.moved) return;
    const now = performance.now(), dt = Math.max(1, now - drag.lt) / 1000;
    drag.vx = drag.vx * .6 + (e.clientX - drag.lx) / dt * .4; drag.vy = drag.vy * .6 + (e.clientY - drag.ly) / dt * .4;
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
    M.x = clamp(e.clientX, W * .3, innerWidth - W * .3); M.y = e.clientY + H * .62;
  });
  const release = e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.moved) { M.mode = 'air'; M.vx = clamp(drag.vx, -1100, 1100); M.vy = clamp(drag.vy, -1100, 1100); M.idle = 0; M.minY = null; say('Wheee!'); }
    else if (performance.now() - drag.t0 < 450) poke();
    drag = null;
  };
  moki.addEventListener('pointerup', release);
  moki.addEventListener('pointercancel', release);

  // Pumunta sa pinindot mo
  document.addEventListener('click', e => {
    if (e.target.closest('#pet, button, input, a, label, form, .ok')) return;
    goTo(e.clientX, e.clientY);
  });

  // Sinusundan ng mata ni Moki ang cursor
  if (!reduce) addEventListener('pointermove', e => {
    if (M.mode === 'ground' && M.tx !== null) return;
    const r = look.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 220);
    look.style.transform = `translate(${dx / d * 5 * m}px, ${dy / d * 4 * m}px)`;
  });

  function toCard() {
    const r = document.querySelector('.card').getBoundingClientRect();
    if (r.top > 70 && r.top < innerHeight - 60) goTo(r.right - W * .7, r.top);
  }
  $('pangalan').addEventListener('focus', () => { say('Anong pangalan mo?'); toCard(); });
  $('pangalan').addEventListener('change', e => {
    const f = e.target.value.trim().split(' ')[0];
    if (f) say('Hi, ' + f + '! Ang ganda ng pangalan mo.');
  });
  kilo.addEventListener('focus', () => say('Ilang kilo ang gusto mo?'));

  // ---- Sales talk: magtanong, magrekomenda, sumagot sa dahilan ----
  let sellTimer, pitchTimer;
  function offer(text, opts) {
    sell.active = true; M.idle = -1e9;
    sayTxt.textContent = text;
    const box = $('sayOpts'); box.innerHTML = '';
    opts.forEach(([label, fn, main]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      if (main) b.className = 'main'; b.onclick = fn; box.appendChild(b);
    });
    bubble.classList.add('sell'); bubble.classList.remove('off', 'talk'); void bubble.offsetWidth; bubble.classList.add('talk');
    clearTimeout(sayTimer); clearTimeout(sellTimer); sellTimer = setTimeout(endSell, 30000);
  }
  function endSell() {
    clearTimeout(sellTimer); sell.active = false; M.idle = 0; moki.classList.remove('smart');
    bubble.classList.remove('sell'); bubble.classList.add('off'); $('sayOpts').innerHTML = '';
  }
  function sad(ms) { moki.classList.add('sad'); setTimeout(() => moki.classList.remove('sad'), ms); }

  const first = () => $('pangalan').value.trim().split(' ')[0];
  const extra = n => SALES.pricePerKilo ? ' Dagdag na ₱' + Math.round(SALES.pricePerKilo * (n - 1)) + ' lang.' : '';
  const bulk = () => SALES.bulkNote ? ' ' + SALES.bulkNote + '.' : '';
  const fresh = () => SALES.freshNote ? ' ' + SALES.freshNote + '.' : '';
  function proof(n) {   // totoong datos mula sa Sheet
    if (STATS.orders < 3) return '';
    const avg = Math.round(STATS.kilos / STATS.orders * 10) / 10;
    return avg > n ? ' Ang karaniwang order dito ay ' + avg + ' kilo.' : '';
  }

  function pitchSoon(from) {
    if (!M.on || sell.done || sell.active || sell.pitched >= 2) return;
    clearTimeout(pitchTimer);
    pitchTimer = setTimeout(() => { if (Number(kilo.value) === 1 && !sell.active) start(from); }, 700);
  }
  function start(from) {
    sell.pitched++; sell.from = from; toCard();
    const n = first();
    offer((from === 'submit' ? 'Teka po' + (n ? ', ' + n : '') + '! ' : '') + 'Isang kilo lang? Ilan ba kayong kakain sa bahay?' + fresh(), [
      ['1-2 tao', () => rec(1)], ['3-4 tao', () => rec(2)], ['5 pataas', () => rec(3)], ['Pang-tinda', () => rec(5)], ['1 kilo lang po', decline]
    ]);
  }
  function rec(n) {
    joy('happy', 900);
    if (n === 1) offer('Swak ang 1 kilo sa 1-2 tao! Pero masarap ito sa sinigang, adobo at sisig. Gusto mo ng 2 kilo para may extra sa susunod na ulam?' + extra(2) + proof(2), [['Sige, 2 kilo', () => accept(2), 1], ['1 kilo lang po', decline]]);
    else if (n === 2) offer('Para sa 3-4 na tao, karaniwang isang ulam lang ang kasya sa 1 kilo. Kung gusto n\'yo ng dalawang ulam, 2 kilo ang swak!' + extra(2) + proof(2), [['Sige, 2 kilo', () => accept(2), 1], ['1 kilo lang po', decline]]);
    else if (n === 3) offer('Dami n\'yo pala, ang saya! Para sa 5 pataas, 3 kilo ang swak para walang mabitin.' + extra(3) + bulk() + proof(3), [['Sige, 3 kilo', () => accept(3), 1], ['2 kilo na lang', () => accept(2)], ['1 kilo lang po', decline]]);
    else offer('Negosyante pala! Para hindi kayo mabitin sa paninda, mas swak ang 5 o 10 kilo.' + extra(5) + bulk() + proof(5), [['5 kilo', () => accept(5), 1], ['10 kilo', () => accept(10)], ['1 kilo muna', decline]]);
  }
  function accept(n) {
    setKilo(n, true); endSell(); joy('happy', 2200); hop(700);
    say('Yehey, ' + n + ' kilo! Pindutin mo na ang "I-reserve" sa baba.');
  }
  function decline() {
    sell.declines++;
    if (sell.declines > 1) return final();
    sad(3200);
    offer('Ay, sige po... 1 kilo. Medyo naiyak lang si Moki ng konti, hihi! Pwede ko bang malaman kung bakit? Baka matulungan kita.', [
      ['Baka mabulok', () => obj('rot')], ['Baka mahal', () => obj('cost')], ['Hindi pa sigurado', () => obj('unsure')], ['Sapat na ang 1 kilo', final]
    ]);
  }
  function obj(kind) {
    if (kind === 'rot') offer('Madali lang iwasan! Ilagay sa ref sa papel na supot o basket (huwag sa saradong plastik), tatagal ito ng ilang araw. Puwede ring i-sauté at i-freeze. Subukan mo ang 1.5 kilo?' + proof(1.5), [['Sige, 1.5 kilo', () => accept(1.5), 1], ['1 kilo lang po', final]]);
    else if (kind === 'cost') offer('Pre-order pa lang ito, walang pilitan! Kahit kalahating kilo lang ang idagdag mo, sapat na ang 1.5 kilo para sa dalawang ulam.' + extra(1.5) + bulk() + proof(1.5), [['Sige, 1.5 kilo', () => accept(1.5), 1], ['1 kilo lang po', final]]);
    else offer('Okay lang! Puwede ring hatiin sa kapitbahay o kamag-anak, ikaw pa ang bida sa handaan. Ano kung 2 kilo, tapos hatian?' + proof(2), [['Sige, 2 kilo', () => accept(2), 1], ['1.5 kilo', () => accept(1.5)], ['1 kilo lang po', final]]);
  }
  function final() {
    sell.done = true; endSell(); joy('happy', 1600);
    say('Sige po, 1 kilo! Salamat sa tiwala. Puwede mo pa ring dagdagan anumang oras.');
    if (sell.from === 'submit') setTimeout(() => $('form').requestSubmit(), 500);
  }
  kilo.addEventListener('change', () => { if (Number(kilo.value) === 1) pitchSoon('kilo'); });


  // ---- Trivia ni Moki: totoong kaalaman tungkol sa kabute (unang sagot = tama, hinahalo bago ipakita) ----
  const QUIZ = [
    { q: 'Anong uri ng nilalang ang mushroom?', a: ['Fungus', 'Halaman', 'Hayop', 'Bakterya'], f: 'Fungus ang mushroom. Mas malapit pa nga ito sa hayop kaysa sa halaman!' },
    { q: 'Bakit hindi berde ang mushroom?', a: ['Wala itong chlorophyll', 'Kulang ito sa tubig', 'Takot ito sa araw'], f: 'Walang chlorophyll ang mushroom, kaya hindi ito nagpo-photosynthesis at kumukuha ito ng sustansya sa paligid.' },
    { q: 'Ano ang tawag sa mga hibla na parang ugat ng mushroom sa ilalim ng lupa?', a: ['Mycelium', 'Spora', 'Tubers', 'Chlorophyll'], f: 'Ang mycelium ang katawan ng fungus. Ang mushroom na kinakain natin ay bunga lang nito.' },
    { q: 'Paano nagpaparami ang mushroom?', a: ['Sa pamamagitan ng spora', 'Sa buto', 'Sa itlog'], f: 'Napakaliliit na spora ang kumakalat sa hangin at tumutubo kapag nakakita ng angkop na lugar.' },
    { q: 'Ilang porsiyento ng sariwang mushroom ang tubig?', a: ['Mga 90%', 'Mga 50%', 'Mga 30%'], f: 'Mga 90% tubig ito, kaya lumiliit ang mushroom kapag niluto.' },
    { q: 'Anong bitamina ang nadaragdagan sa mushroom kapag nasikatan ng araw (UV)?', a: ['Bitamina D', 'Bitamina C', 'Bitamina K'], f: 'Gumagawa ng bitamina D ang mushroom kapag naarawan, parang balat natin.' },
    { q: 'Ayon sa lawak, alin ang isa sa pinakamalaking buhay na organismo sa mundo?', a: ['Honey fungus sa Oregon, USA', 'Puno ng niyog', 'Asul na balyena'], f: 'Isang honey fungus sa Oregon ang kumakalat sa mahigit 9 na kilometro kuwadrado sa ilalim ng lupa.' },
    { q: 'Puwede bang kainin ang lahat ng ligaw na kabute?', a: ['Hindi, may nakalalason', 'Oo, basta luto', 'Oo, basta makulay'], f: 'Huwag kumain ng ligaw na kabute kung hindi sigurado. Hindi nawawala sa pagluluto ang lason ng ilan.' },
    { q: 'Saan pinakamainam itago ang sariwang mushroom sa ref?', a: ['Sa papel na supot o basket', 'Sa saradong basang plastik', 'Sa tabi ng bintana'], f: 'Kailangan nitong huminga. Ang papel ay sumisipsip ng sobrang halumigmig kaya hindi agad nabubulok.' }
  ];
  const ROUND = 5, T = { n: 0, pool: [], score: 0 };
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

  function triviaStart() {
    if (!M.on) $('petToggle').click();
    T.pool = shuffle(QUIZ.map((_, i) => i)); T.n = 0; T.score = 0;
    moki.classList.add('smart'); toCard(); joy('happy', 1200);
    offer('Trivia time! ' + ROUND + ' tanong tungkol sa kabute ang ihahanda ni Moki. Handa ka na ba?', [['Game!', triviaAsk, 1], ['Mamaya na', triviaEnd]]);
  }
  function triviaAsk() {
    const it = QUIZ[T.pool[T.n++]];
    offer('Tanong ' + T.n + ' sa ' + ROUND + ': ' + it.q,
      shuffle(it.a.map((t, i) => [t, () => triviaAns(i === 0, it)])));
  }
  function triviaAns(ok, it) {
    if (ok) { T.score++; joy('happy', 1800); hop(600); } else sad(2600);
    offer((ok ? 'Tama! ' : 'Naku, mali. Ang tamang sagot ay "' + it.a[0] + '". ') + it.f,
      T.n < ROUND ? [['Susunod', triviaAsk, 1], ['Tama na', triviaEnd]] : [['Tingnan ang score', triviaResult, 1]]);
  }
  function triviaResult() {
    const s = T.score, msg = s === ROUND ? 'Perfect! Ikaw na ang kabute master!' : s >= 3 ? 'Magaling! Marami ka nang alam tungkol sa kabute.' : 'Okay lang, ngayon alam mo na!';
    $('tScore').textContent = ' · ' + s + '/' + ROUND; joy('happy', 2400); if (s >= 3) hop(700);
    offer('Score mo: ' + s + ' sa ' + ROUND + '. ' + msg, [['Ulitin', triviaStart, 1], ['Mag-reserve na', triviaEnd]]);
  }
  function triviaEnd() { endSell(); if (T.n) say('Salamat sa laro! Puwede mo nang i-reserve ang mushroom mo.'); }
  $('triviaBtn').addEventListener('click', triviaStart);
  setTimeout(() => {   // minsang paanyaya kapag wala pang ginagawa
    if (M.on && !sell.active && !sell.done && !$('pangalan').value && document.activeElement !== $('pangalan'))
      offer('Alam mo bang marunong mag-trivia si Moki? Subukan mo!', [['Game!', triviaStart, 1], ['Mamaya na', endSell]]);
  }, 25000);

  $('petToggle').addEventListener('click', e => {
    M.on = !M.on; pet.classList.toggle('off', !M.on);
    if (!M.on) { endSell(); bubble.classList.add('off'); clearTimeout(sayTimer); } else { spawn(innerWidth * .5); last = performance.now(); say('Balik na ako!'); }
    e.currentTarget.setAttribute('aria-pressed', M.on);
    e.currentTarget.textContent = M.on ? 'Itago si Moki' : 'Ipakita si Moki';
  });
  addEventListener('resize', size);

  size();
  { const r = art.getBoundingClientRect(); spawn(r.top < innerHeight - 40 ? r.left + r.width / 2 : innerWidth * .78); }
  requestAnimationFrame(frame);
  setTimeout(() => say('Hi! Ako si Moki. Hawakan mo ako!'), 1300);

  loadStats();
</script>
</body>
</html>
